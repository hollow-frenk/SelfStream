name: Sync Fork
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync with Upstream
              - name: Sync with Upstream
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          cp .github/workflows/sync.yml /tmp/sync.yml
          
          git remote add upstream https://github.com/qwertyuiop8899/SelfStream.git
          git fetch upstream
          git reset --hard upstream/main
          
          mkdir -p .github/workflows
          cp /tmp/sync.yml .github/workflows/sync.yml
          
          git add .github/workflows/sync.yml
          git diff --cached --quiet || git commit -m "chore: restore sync workflow"
          
          git push origin main --force
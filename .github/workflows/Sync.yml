name: Sync Fork
on:
  schedule:
    - cron: '0 0 * * *' # Esegue la sincronizzazione ogni giorno a mezzanotte
  workflow_dispatch: # Permette di avviarlo manualmente con un tasto

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync with Upstream
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git remote add upstream https://github.com/hollow_frenk/SelfStream.git
          git fetch upstream
          git checkout main
          git merge upstream/main
          git push origin main
